  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Universal Editor: definitions aligned with https://github.com/ynakagawa/SecurBank (public/static) -->

  <script type="application/vnd.adobe.aue.filter+json" src="/static/filter-definition.json"></script>

  <script>
    (function () {
      var h = typeof location !== 'undefined' ? location.hostname : '';
      if (h === 'localhost' || h === '127.0.0.1') {
        window.__AEM_EMBED_PROXY_MAP__ = Object.assign({}, window.__AEM_EMBED_PROXY_MAP__ || {}, {
          'https://main--embed-example--aemsites.aem.page': '/aem-embed-proxy/embed-example'
        });
      }
    })();
  </script>
  <!-- aem-embed.js: loaded from main.ts so Vite does not pre-transform /scripts/... as repo-root -->
